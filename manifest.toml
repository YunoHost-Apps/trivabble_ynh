#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "trivabble"
name = "Trivabble"
description.en = "Scrabble® game free play not enforcing rules"
description.fr = "Scrabble® en jeu libre, à l'utilisateur d'appliquer les règles"

version = "2025.12.06~ynh1"

maintainers = ["Philippe Lhardy"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://trivabble.org/"
code = "https://git.jakse.fr/trivabble/trivabble"

[integration]
architectures = "all"
yunohost = ">= 12.1.38"
helpers_version = "2.1"
multi_instance = false

ldap = false
sso = false

disk = "250M"
ram.build = "150M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    #[install.path]
    #type = "path"
    #default = "/trivabble"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources.main]
    url = "https://git.jakse.fr/trivabble/trivabble/archive/prod-v20251206.tar.gz"
    sha256 = "ec0814f085432d7abc78010fb8945ec6326bd40ec8beaad15d1d14bb5b03cdeb"

    [resources.system_user]
    
    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    
    [resources.apt]
    packages = ["rsync"]

    [resources.nodejs]
    version = "22"
